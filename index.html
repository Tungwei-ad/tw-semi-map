<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台灣半導體廠區地圖</title>
<meta name="description" content="股價 100 元以上的台灣上市櫃半導體與供應鏈公司,登記地址、營運據點與工廠位置。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f4; --panel:#ffffff; --ink:#1b2422; --muted:#5f6e6a; --line:#d8dfdc; --chip-bg:#eef2f0;
  --reg:#b03a6f; --hq:#0b6a86; --fac:#c77a0e; --ring:#1b2422; --warn-bg:#fff4dc; --warn-ink:#6b4a00;
  /* point colors drawn on satellite imagery: same in both themes */
  --m-reg:#ff6fae; --m-hq:#4fd1ff; --m-fac:#ffb020;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#121816; --panel:#19211f; --ink:#e3ebe8; --muted:#93a39e; --line:#2c3835; --chip-bg:#24302d;
    --reg:#e57aa8; --hq:#4fb8d6; --fac:#e9a64a; --ring:#e3ebe8; --warn-bg:#3a2f14; --warn-ink:#f3d58e;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:16px}
.wrap{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px;max-width:70ch}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;padding:8px 12px;font-size:13px}
.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;height:calc(100vh - 130px);min-height:600px}
.mapbox{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#1d2422}
#gmap{position:absolute;inset:0}
.legend{position:absolute;top:58px;left:10px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:12px;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.legend label{display:flex;align-items:center;gap:7px;cursor:pointer}
.legend svg{width:14px;height:14px;flex:none}
.lnote{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;padding-left:20px}
.tools{position:absolute;top:58px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.tools button{min-width:40px;height:34px;padding:0 8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;font-size:12px;cursor:pointer;font-family:var(--sans);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.tools button.gap{margin-top:8px}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tools button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible,label:focus-within{outline:2px solid var(--hq);outline-offset:1px}
.hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:12px;color:#fff;background:rgba(0,0,0,.6);border-radius:4px;padding:4px 10px;z-index:2;pointer-events:none;white-space:nowrap}
.card{position:absolute;left:10px;bottom:28px;width:min(360px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:13px;z-index:3}
.card h3{margin:0;font-size:16px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-right:18px}
.card .tk{font-family:var(--mono);color:var(--muted);font-size:12px;font-weight:400}
.card .px{font-family:var(--mono);margin-left:auto;font-size:15px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0}
.card dt{color:var(--muted);font-size:12px}
.card dd{margin:0;overflow-wrap:anywhere}
.card .x{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
.card a{color:var(--hq)}
.card .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{padding:5px 10px;border:1px solid var(--line);border-radius:5px;background:var(--chip-bg);color:var(--ink);font:inherit;font-size:12px;cursor:pointer;text-decoration:none}
.tip{position:absolute;pointer-events:none;background:rgba(0,0,0,.8);color:#fff;font-size:12px;padding:3px 7px;border-radius:3px;white-space:nowrap;transform:translate(12px,-50%);z-index:4}
.side{display:flex;flex-direction:column;gap:14px;min-height:0}
.ringbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-height:45%;min-height:0}
.ringbox h2{font-size:14px;margin:0;display:flex;align-items:center;gap:8px}
.ringbox h2 .c{font-weight:400;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.ringrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ringrow input{width:9em;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:12px}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.rings div{background:var(--chip-bg);border-radius:5px;padding:5px 8px;display:flex;flex-direction:column}
.rings b{font-family:var(--mono);font-size:16px;font-weight:500}
.rings span{font-size:11px;color:var(--muted)}
.near{overflow:auto;min-height:0;font-size:12px;border-top:1px solid var(--line)}
.near div{display:flex;gap:8px;padding:4px 2px;border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.near div:hover{background:var(--chip-bg)}
.near .d{font-family:var(--mono);width:4.2em;text-align:right;flex:none;color:var(--muted)}
.near .n{font-weight:500}
.near .t{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0;flex:1}
.filters{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.filters input{flex:1 1 160px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit}
.filters select{padding:7px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit}
.tablewrap{overflow:auto;flex:1;min-height:0}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line);z-index:1}
tbody tr{cursor:pointer;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--chip-bg)}
tbody tr.on{background:var(--chip-bg);box-shadow:inset 3px 0 0 var(--ink)}
td{padding:8px 10px}
td.tk,td.px{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.px{text-align:right}
td.px small{display:block;color:var(--muted);font-size:10px}
td.nm{font-weight:500;white-space:nowrap}
td.nm small{display:block;font-weight:400;color:var(--muted);font-size:11px;white-space:normal;max-width:9em}
.addr{display:flex;gap:6px;align-items:baseline;line-height:1.45;margin-bottom:3px}
.chip{flex:none;font-size:10px;padding:0 5px;border-radius:3px;border:1px solid currentColor;line-height:1.6}
.chip.registered{color:var(--reg)} .chip.headquarters{color:var(--hq)} .chip.factory{color:var(--fac)}
.note{color:var(--muted);font-size:11px}
.foot{font-size:11px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
.plabel{text-shadow:0 0 3px #000,0 0 2px #000,0 0 1px #000}
@media (max-width:900px){
  .main{grid-template-columns:1fr;height:auto}
  .mapbox{height:72vh;min-height:440px}
  .ringbox{max-height:none}
  .tablewrap{max-height:70vh}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>台灣半導體廠區地圖</h1>
      <p class="sub">股價 100 元以上的上市櫃半導體公司與供應鏈(設備、材料、載板、廠務工程、分析服務),標示登記地址、營運據點與工廠。股價為 2026-10-19 收盤。</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-co">0</b><span>公司</span></div>
      <div class="stat"><b id="s-pt">0</b><span>據點</span></div>
      <div class="stat"><b id="s-fac">0</b><span>工廠</span></div>
    </div>
  </header>
  <div class="notice" id="notice" hidden></div>

  <div class="main">
    <div class="mapbox" id="mapbox">
      <div id="gmap" role="application" aria-label="Google 衛星地圖,標示半導體公司據點"></div>
      <div class="legend" aria-label="據點類型">
        <label><input type="checkbox" id="f-registered" checked><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="var(--m-reg)" stroke-width="2.5"/></svg>登記地址</label>
        <label><input type="checkbox" id="f-headquarters" checked><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="var(--m-hq)" stroke="#fff"/></svg>營運／總部</label>
        <label><input type="checkbox" id="f-factory" checked><svg viewBox="0 0 14 14"><rect x="2.5" y="2.5" width="9" height="9" fill="var(--m-fac)" stroke="#fff"/></svg>工廠</label>
        <span class="lnote"><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="var(--m-hq)" opacity=".45"/></svg>半透明:只定位到鄉鎮</span>
      </div>
      <div class="tools">
        <button id="ringbtn" aria-pressed="false" title="開啟後點地圖任一處設定圓心">同心圓</button>
        <button id="zreset" title="回到全台視角">全台</button>
        <button id="fsup" class="gap" aria-label="放大地圖文字">字+</button>
        <button id="fsdown" aria-label="縮小地圖文字">字−</button>
      </div>
      <div class="hint" id="hint">放大後顯示公司名稱 · 點「同心圓」再點地圖可畫距離圈</div>
      <div class="card" id="card" hidden></div>
      <div class="tip" id="tip" hidden></div>
    </div>

    <div class="side">
      <section class="ringbox" id="ringbox" hidden aria-label="同心圓分析">
        <h2>同心圓分析 <span class="c" id="ring-center">點地圖設定圓心</span></h2>
        <div class="ringrow">
          <label for="ring-r">半徑(公里)</label>
          <input id="ring-r" type="text" inputmode="decimal" value="1,3,5,10" aria-describedby="ring-help">
          <span id="ring-help">以逗號分隔,可拖曳圓心移動</span>
          <button class="btn" id="ring-clear">清除</button>
        </div>
        <div class="rings" id="ring-stats"></div>
        <div class="near" id="ring-near"></div>
      </section>

      <div class="listbox">
        <div class="filters">
          <input id="q" type="search" placeholder="搜尋公司、代號或地址(例:台積電、竹北、湖口)" aria-label="搜尋">
          <select id="grp" aria-label="產業"><option value="">全部產業</option></select>
          <select id="sort" aria-label="排序">
            <option value="price">股價高→低</option>
            <option value="ticker">股票代號</option>
            <option value="sites">據點數多→少</option>
          </select>
        </div>
        <div class="tablewrap">
          <table>
            <thead><tr><th>代號</th><th>公司</th><th style="text-align:right">股價</th><th>地址</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="foot">座標為近似位置,並非門牌定位:已知路段或園區者依路段推估,其餘放在所屬鄉鎮市區的中心(地圖上半透明)。地址整理自經濟部商工登記、登記工廠名錄、公開資訊觀測站與公司官網。股價來源:臺灣證券交易所、證券櫃檯買賣中心。</div>
      </div>
    </div>
  </div>
</div>

路一之二號四、五、六樓", "note": "竹南三廠", "source": "https://data.gov.tw/dataset/6569 (經濟部登記工廠名錄,工廠登記編號05000397)", "lat": 24.69775, "lon": 120.87774, "geo_precision": "district"}, {"type": "factory", "address": "苗栗縣竹南鎮公義里群義路1之5號1、2、3、4樓", "note": "竹南五廠", "source": "https://data.gov.tw/dataset/6569 (經濟部登記工廠名錄,工廠登記編號05000792)", "lat": 24.69866, "lon": 120.87849, "geo_precision": "district"}], "group": "IC設計與IP", "market": "上櫃"}, {"ticker": "6756", "name": "威鋒電子", "price": 121, "price_date": "2026-10-19", "price_source": "https://www.twse.com.tw/zh/trading/historical/mi-index.html", "category": "IC設計:USB/Thunderbolt/PCIe等連接介面與影像處理晶片,威盛電子分拆上市之子公司", "addresses": [{"type": "registered", "address": "新北市新店區中正路529之1號7樓", "note": "經濟部商工登記公司所在地", "source": "https://info.technews.tw/company/29125676-%E5%A8%81%E9%8B%92%E9%9B%BB%E5%AD%90%E8%82%A1%E4%BB%BD%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8", "lat": 24.93002, "lon": 121.53022, "geo_precision": "district"}, {"type": "headquarters", "address": "新北市新店區中正路529之1號7樓", "source": "https://www.wantgoo.com/stock/6756/company-profile", "lat": 24.93413, "lon": 121.52921, "geo_precision": "district"}], "market": "上市", "group": "IC設計與IP"}]</script>
<script>
const GMAPS_KEY = "";
const TYPES={registered:"登記",headquarters:"營運",factory:"工廠"};
const TYPE_FULL={registered:"登記地址",headquarters:"營運／總部",factory:"工廠"};
const PREC={road:"依路段推估",area:"依園區／工業區推估",district:"放在鄉鎮市區中心(未定位到路段)"};
const MCOL={registered:"#ff6fae",headquarters:"#4fd1ff",factory:"#ffb020"};
const data=JSON.parse(document.getElementById("data").textContent);
const pts=[];
data.forEach(c=>c.addresses.forEach(a=>{ if(a.lat!=null) pts.push({c,a,i:pts.length}); }));

const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:null;}
function fmtPrice(v){return Number(v).toLocaleString("zh-TW",{maximumFractionDigits:2});}
function km(a,b){const R=6371,t=Math.PI/180,dLa=(b.lat-a.lat)*t,dLo=(b.lng-a.lng)*t;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function fmtKm(d){return d<10?d.toFixed(1):Math.round(d)+"";}

/* ---------- filters & list (work even before the map loads) ---------- */
const typeOn={registered:true,headquarters:true,factory:true};
let selected=null;
let ringOn=false, ringCenter=null, ringLabel="";
const q=$("q"),sortSel=$("sort"),grpSel=$("grp"),rows=$("rows");
const gCount={};data.forEach(c=>gCount[c.group]=(gCount[c.group]||0)+1);
Object.keys(gCount).sort((a,b)=>gCount[b]-gCount[a]).forEach(g=>{
  const o=document.createElement("option");o.value=g;o.textContent=g+"("+gCount[g]+")";grpSel.appendChild(o);});
function matches(c){
  if(grpSel.value&&c.group!==grpSel.value)return false;
  const s=q.value.trim().toLowerCase(); if(!s)return true;
  return (c.name+c.ticker+(c.category||"")+c.addresses.map(a=>a.address+(a.note||"")).join(" ")).toLowerCase().includes(s);
}
let vis=new Set();
function ptVisible(p){return vis.has(p.c.ticker)&&typeOn[p.a.type];}
function apply(){
  vis=new Set(data.filter(matches).map(c=>c.ticker));
  const sorted=data.filter(c=>vis.has(c.ticker)).sort({
    price:(a,b)=>b.price-a.price, ticker:(a,b)=>a.ticker.localeCompare(b.ticker),
    sites:(a,b)=>b.addresses.length-a.addresses.length||b.price-a.price}[sortSel.value]);
  rows.innerHTML=sorted.map(c=>
    '<tr tabindex="0" data-tk="'+esc(c.ticker)+'"'+(c.ticker===selected?' class="on"':'')+'>'+
    '<td class="tk">'+esc(c.ticker)+'</td>'+
    '<td class="nm">'+esc(c.name)+'<small>'+esc(c.group)+'</small></td>'+
    '<td class="px">'+fmtPrice(c.price)+'<small>'+esc(c.price_date.slice(5))+'</small></td>'+
    '<td>'+c.addresses.map(a=>'<div class="addr"><span class="chip '+a.type+'">'+TYPES[a.type]+'</span><span>'+esc(a.address)+(a.note?' <span class="note">'+esc(a.note)+'</span>':'')+'</span></div>').join("")+'</td></tr>').join("");
  const shown=pts.filter(ptVisible);
  $("s-co").textContent=sorted.length; $("s-pt").textContent=shown.length;
  $("s-fac").textContent=shown.filter(p=>p.a.type==="factory").length;
  if(window.restyle)restyle();
  if(window.updateRings)updateRings();
}
["registered","headquarters","factory"].forEach(t=>{$("f-"+t).onchange=e=>{typeOn[t]=e.target.checked;apply();};});
q.addEventListener("input",apply); sortSel.addEventListener("change",apply); grpSel.addEventListener("change",apply);
rows.addEventListener("click",e=>{const tr=e.target.closest("tr");if(tr)select(tr.dataset.tk,true);});
rows.addEventListener("keydown",e=>{if(e.key==="Enter"){const tr=e.target.closest("tr");if(tr)select(tr.dataset.tk,true);}});
function select(tk,fly){
  selected=(tk&&tk===selected&&fly)?null:tk;
  apply();
  if(!selected||!fly||!window.map)return;
  const my=pts.filter(p=>p.c.ticker===selected&&typeOn[p.a.type]);
  if(!my.length)return;
  if(my.length===1){map.panTo({lat:my[0].a.lat,lng:my[0].a.lon});map.setZoom(15);}
  else{const b=new google.maps.LatLngBounds();my.forEach(p=>b.extend({lat:p.a.lat,lng:p.a.lon}));map.fitBounds(b,60);
    google.maps.event.addListenerOnce(map,"idle",()=>{if(map.getZoom()>16)map.setZoom(16);});}
  if(matchMedia("(max-width:900px)").matches)$("mapbox").scrollIntoView({behavior:"smooth",block:"start"});
}
apply();

/* ---------- text size ---------- */
const FS_STEPS=[0.8,1,1.25,1.5,1.8,2.2];
let fsIdx=2;
try{const v=+localStorage.getItem("tw-semi-fs");if(FS_STEPS.includes(v))fsIdx=FS_STEPS.indexOf(v);}catch(e){}
function setFs(d){fsIdx=Math.max(0,Math.min(FS_STEPS.length-1,fsIdx+d));
  try{localStorage.setItem("tw-semi-fs",FS_STEPS[fsIdx]);}catch(e){}
  $("fsup").disabled=fsIdx===FS_STEPS.length-1;$("fsdown").disabled=fsIdx===0;
  if(window.restyle)restyle(); if(window.drawRings)drawRings();}
$("fsup").onclick=()=>setFs(1); $("fsdown").onclick=()=>setFs(-1); setFs(0);

/* ---------- card ---------- */
const card=$("card");
function showCard(p){
  const src=safeUrl(p.a.source),psrc=safeUrl(p.c.price_source);
  const gm="https://www.google.com/maps/@?api=1&map_action=map&center="+p.a.lat+","+p.a.lon+"&zoom=17&basemap=satellite";
  card.innerHTML='<button class="x" aria-label="關閉">×</button>'+
    '<h3>'+esc(p.c.name)+'<span class="tk">'+esc(p.c.ticker)+' '+esc(p.c.market||"")+'</span><span class="px">'+fmtPrice(p.c.price)+' 元</span></h3>'+
    '<dl><dt>產業</dt><dd>'+esc(p.c.category||p.c.group)+'</dd>'+
    '<dt>類型</dt><dd><span class="chip '+p.a.type+'">'+TYPE_FULL[p.a.type]+'</span>'+(p.a.note?' '+esc(p.a.note):'')+'</dd>'+
    '<dt>地址</dt><dd>'+esc(p.a.address)+'</dd>'+
    '<dt>定位</dt><dd>'+(PREC[p.a.geo_precision]||"近似")+'</dd>'+
    '<dt>股價日</dt><dd>'+esc(p.c.price_date)+(psrc?' · <a href="'+esc(psrc)+'" target="_blank" rel="noopener">行情來源</a>':'')+'</dd>'+
    '<dt>來源</dt><dd>本公司共 '+p.c.addresses.length+' 筆地址'+(src?' · <a href="'+esc(src)+'" target="_blank" rel="noopener">地址來源</a>':'')+'</dd></dl>'+
    '<div class="acts"><button class="btn" id="as-center">以此為圓心</button><a class="btn" href="'+esc(gm)+'" target="_blank" rel="noopener">在 Google 地圖開啟</a></div>';
  card.hidden=false;
  card.querySelector(".x").onclick=()=>{card.hidden=true;};
  $("as-center").onclick=()=>{setRingCenter({lat:p.a.lat,lng:p.a.lon},p.c.name+" "+TYPE_FULL[p.a.type]+(p.a.note?"("+p.a.note+")":""));};
}

/* ---------- rings (state lives outside the map so the panel works) ---------- */
function radii(){return $("ring-r").value.split(/[,,\s]+/).map(Number).filter(r=>r>0&&r<=500).sort((a,b)=>a-b).slice(0,8);}
function setRingMode(on){ringOn=on;$("ringbtn").setAttribute("aria-pressed",on);$("ringbox").hidden=!on;
  if(window.map)map.setOptions({draggableCursor:on?"crosshair":null});
  if(!on){ringCenter=null;} if(window.drawRings)drawRings(); updateRings();}
function setRingCenter(ll,label){ringCenter=ll;ringLabel=label||"";if(!ringOn)setRingMode(true);else{if(window.drawRings)drawRings();updateRings();}}
$("ringbtn").onclick=()=>setRingMode(!ringOn);
$("ring-clear").onclick=()=>{ringCenter=null;ringLabel="";if(window.drawRings)drawRings();updateRings();};
$("ring-r").addEventListener("input",()=>{if(window.drawRings)drawRings();updateRings();});
function updateRings(){
  const st=$("ring-stats"),near=$("ring-near");
  if(!ringCenter){$("ring-center").textContent="點地圖任一處或資訊卡的「以此為圓心」";st.innerHTML="";near.innerHTML="";return;}
  $("ring-center").textContent=(ringLabel?ringLabel+" · ":"")+ringCenter.lat.toFixed(4)+", "+ringCenter.lng.toFixed(4);
  const rs=radii(),max=rs[rs.length-1]||0;
  const ds=pts.filter(ptVisible).map(p=>({p,d:km(ringCenter,{lat:p.a.lat,lng:p.a.lon})})).filter(x=>x.d<=max).sort((a,b)=>a.d-b.d);
  st.innerHTML=rs.map(r=>{const inR=ds.filter(x=>x.d<=r);const co=new Set(inR.map(x=>x.p.c.ticker)).size;
    return '<div><span>'+r+' 公里內</span><b>'+co+' 家</b><span>'+inR.length+' 個據點 · 工廠 '+inR.filter(x=>x.p.a.type==="factory").length+'</span></div>';}).join("");
  near.innerHTML=ds.slice(0,200).map(x=>'<div data-i="'+x.p.i+'"><span class="d">'+fmtKm(x.d)+' km</span><span class="n">'+esc(x.p.c.name)+'</span><span class="t">'+TYPES[x.p.a.type]+(x.p.a.note?" · "+esc(x.p.a.note):"")+'</span></div>').join("")||'<div><span class="t">範圍內沒有據點</span></div>';
}
$("ring-near").addEventListener("click",e=>{const d=e.target.closest("[data-i]");if(!d)return;const p=pts[+d.dataset.i];
  showCard(p);selected=p.c.ticker;apply();if(window.map){map.panTo({lat:p.a.lat,lng:p.a.lon});}});

/* ---------- Google Map ---------- */
function initMap(){
  window.map=new google.maps.Map($("gmap"),{
    center:{lat:23.75,lng:120.95},zoom:8,mapTypeId:"hybrid",
    mapTypeControl:true,mapTypeControlOptions:{mapTypeIds:["hybrid","satellite","roadmap","terrain"],style:google.maps.MapTypeControlStyle.HORIZONTAL_BAR,position:google.maps.ControlPosition.TOP_CENTER},
    streetViewControl:false,fullscreenControl:true,gestureHandling:"greedy",clickableIcons:false,
    zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_BOTTOM}
  });
  map.data.addGeoJson({type:"FeatureCollection",features:pts.map(p=>({type:"Feature",geometry:{type:"Point",coordinates:[p.a.lon,p.a.lat]},properties:{i:p.i}}))});
  const SQUARE="M -1 -1 L 1 -1 L 1 1 L -1 1 Z";
  window.restyle=function(){
    const z=map.getZoom(),f=FS_STEPS[fsIdx],showLabel=z>=14,showMeta=z>=16,s=z>=13?6:z>=10?5:4;
    map.data.setStyle(feat=>{
      const p=pts[feat.getProperty("i")],t=p.a.type;
      if(!ptVisible(p))return{visible:false};
      const dim=selected&&p.c.ticker!==selected, approx=p.a.geo_precision==="district";
      const op=dim?0.15:approx?0.5:1;
      const icon=t==="factory"
        ?{path:SQUARE,scale:s*0.85,fillColor:MCOL[t],fillOpacity:op,strokeColor:"#fff",strokeOpacity:op,strokeWeight:p.c.ticker===selected?2.5:1.2,labelOrigin:new google.maps.Point(0,-2.6)}
        :t==="headquarters"
        ?{path:google.maps.SymbolPath.CIRCLE,scale:s,fillColor:MCOL[t],fillOpacity:op,strokeColor:"#fff",strokeOpacity:op,strokeWeight:p.c.ticker===selected?2.5:1.2,labelOrigin:new google.maps.Point(0,-2.4)}
        :{path:google.maps.SymbolPath.CIRCLE,scale:s,fillOpacity:0,strokeColor:MCOL[t],strokeOpacity:op,strokeWeight:p.c.ticker===selected?3.5:2.5,labelOrigin:new google.maps.Point(0,-2.4)};
      const st={icon,zIndex:t==="factory"?3:t==="headquarters"?2:1,title:p.c.name+" "+TYPE_FULL[p.a.type]};
      if(showLabel&&!dim)st.label={text:p.c.name+(showMeta?" "+TYPES[t]+(p.a.note?"·"+p.a.note:""):""),color:"#ffffff",fontSize:Math.round(12*f)+"px",fontWeight:"600",className:"plabel"};
      return st;
    });
    $("hint").hidden=z>=14;
  };
  restyle();
  map.addListener("zoom_changed",restyle);

  const tip=$("tip"),box=$("mapbox");
  map.data.addListener("mouseover",e=>{const p=pts[e.feature.getProperty("i")];tip.textContent=p.c.name+" "+p.c.ticker+" · "+TYPE_FULL[p.a.type];tip.hidden=false;
    if(e.domEvent){const r=box.getBoundingClientRect();tip.style.left=(e.domEvent.clientX-r.left)+"px";tip.style.top=(e.domEvent.clientY-r.top)+"px";}});
  map.data.addListener("mouseout",()=>{tip.hidden=true;});
  map.data.addListener("click",e=>{
    const p=pts[e.feature.getProperty("i")];
    if(ringOn&&!ringCenter){setRingCenter({lat:p.a.lat,lng:p.a.lon},p.c.name+" "+TYPE_FULL[p.a.type]);}
    showCard(p);selected=p.c.ticker;apply();});
  map.addListener("click",e=>{
    if(ringOn){setRingCenter({lat:e.latLng.lat(),lng:e.latLng.lng()},"");}
    else card.hidden=true;});

  /* concentric rings */
  let circles=[];
  const ringData=new google.maps.Data({map});
  ringData.setStyle(feat=>feat.getProperty("center")
    ?{draggable:true,zIndex:10,icon:{path:"M -1 0 L 1 0 M 0 -1 L 0 1",scale:9,strokeColor:"#fff",strokeWeight:3},title:"拖曳以移動圓心"}
    :{clickable:false,icon:{path:google.maps.SymbolPath.CIRCLE,scale:0},label:{text:feat.getProperty("t"),color:"#fff",fontSize:Math.round(12*FS_STEPS[fsIdx])+"px",fontWeight:"700",className:"plabel"}});
  ringData.addListener("setgeometry",e=>{if(!e.feature.getProperty("center"))return;const g=e.newGeometry.get();
    ringCenter={lat:g.lat(),lng:g.lng()};ringLabel="";drawRings(true);updateRings();});
  window.drawRings=function(keepCenter){
    circles.forEach(c=>c.setMap(null));circles=[];
    const drop=[];ringData.forEach(f=>{if(!(keepCenter&&f.getProperty("center")))drop.push(f);});
    drop.forEach(f=>ringData.remove(f));
    if(!ringCenter)return;
    radii().forEach((r,k)=>{
      circles.push(new google.maps.Circle({map,center:ringCenter,radius:r*1000,clickable:false,
        strokeColor:"#ffffff",strokeOpacity:.95,strokeWeight:2,fillColor:"#ffffff",fillOpacity:k===0?.08:.03}));
      const top=google.maps.geometry.spherical.computeOffset(ringCenter,r*1000,0);
      ringData.add({geometry:new google.maps.Data.Point(top),properties:{t:r+" km"}});
    });
    if(!keepCenter)ringData.add({geometry:new google.maps.Data.Point(ringCenter),properties:{center:true}});
    ringData.setStyle(ringData.getStyle());
  };
  map.setOptions({draggableCursor:ringOn?"crosshair":null});
  drawRings();
}
$("zreset").onclick=()=>{selected=null;card.hidden=true;apply();if(window.map){map.setCenter({lat:23.75,lng:120.95});map.setZoom(8);}};

window.gm_authFailure=function(){
  const n=$("notice");n.hidden=false;
  n.textContent="Google 地圖金鑰無效,或這個網址沒有被加入金鑰的允許清單,所以地圖無法正常顯示。清單和篩選仍可使用。";
};
(function(){
  if(!GMAPS_KEY){const n=$("notice");n.hidden=false;n.textContent="尚未設定 Google Maps API 金鑰,地圖以 Google 的開發模式顯示(畫面較暗、有浮水印),功能都可正常使用。";}
  const s=document.createElement("script");
  s.src="https://maps.googleapis.com/maps/api/js?"+(GMAPS_KEY?"key="+encodeURIComponent(GMAPS_KEY)+"&":"")+"callback=initMap&v=weekly&language=zh-TW&region=TW&libraries=geometry&loading=async";
  s.async=true;
  s.onerror=()=>{const n=$("notice");n.hidden=false;n.textContent="無法載入 Google 地圖,請確認網路連線。清單和篩選仍可使用。";};
  document.head.appendChild(s);
})();
</script>
